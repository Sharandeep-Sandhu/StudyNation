<style id="eq-inline-css">
  /*
    Glyph-normalized equation PNGs (see docx _enhance_equation_png):
    main character line ≈ 28px in the file. Display at natural size
    (height:auto) so every formula has the SAME character size.
    Multi-line formulas are taller overall but letters match single-line ones.
  */
  img.eq-math-img,
  img.eq-inline,
  img[src*="question_equations"],
  .question-text img[src*="question_equations"],
  .q-options img[src*="question_equations"],
  .pq-question-text img[src*="question_equations"],
  .pq-option-text img[src*="question_equations"],
  .pq-option img[src*="question_equations"],
  .eb-q-stem img[src*="question_equations"],
  .eb-opt-text img[src*="question_equations"],
  .pr-review-text img[src*="question_equations"] {
    display: inline-block !important;
    height: auto !important;
    max-height: 48px !important;
    width: auto !important;
    max-width: min(96vw, 720px) !important;
    vertical-align: middle !important;
    object-fit: contain !important;
    margin: 2px 4px !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  span.eq-math,
  span.eq-math--lg {
    display: inline !important;
    height: auto !important;
    max-height: none !important;
    min-height: 0 !important;
    line-height: inherit !important;
    margin: 0 !important;
    padding: 0 !important;
    vertical-align: middle !important;
    border: none !important;
    background: transparent !important;
  }

  .eq-images img,
  .eq-ref-strip img {
    height: auto !important;
    max-height: 48px !important;
    width: auto !important;
    object-fit: contain !important;
    vertical-align: middle !important;
  }

  .katex { font-size: 1.05em !important; }
  .katex-display { margin: 0.4em 0 !important; overflow-x: auto; }
  .katex-display > .katex { font-size: 1.08em !important; }

  .question-text, .pq-question-text, .pq-option-text, .q-options, .pr-review-text {
    line-height: 1.9;
  }
</style>
<script id="eq-natural-size-js">
(function () {
  /**
   * Clear forced heights from older CSS/DB so glyph-normalized PNGs
   * display at natural size (same character size for every formula).
   */
  function force(img) {
    if (!img || img.tagName !== "IMG") return;
    var src = img.getAttribute("src") || "";
    var cls = String(img.className || "");
    if (
      src.indexOf("question_equations") === -1 &&
      cls.indexOf("eq-math") === -1 &&
      cls.indexOf("eq-inline") === -1
    ) return;

    img.classList.add("eq-math-img");
    img.removeAttribute("width");
    img.removeAttribute("height");
    img.style.setProperty("height", "auto", "important");
    img.style.setProperty("max-height", "48px", "important");
    img.style.setProperty("min-height", "0", "important");
    img.style.setProperty("width", "auto", "important");
    img.style.setProperty("max-width", "min(96vw,720px)", "important");
    img.style.setProperty("display", "inline-block", "important");
    img.style.setProperty("vertical-align", "middle", "important");
    img.style.setProperty("object-fit", "contain", "important");
    img.style.setProperty("margin", "2px 4px", "important");
    img.style.setProperty("padding", "0", "important");
    img.style.setProperty("border", "0", "important");
    img.style.setProperty("background", "transparent", "important");

    var p = img.parentElement;
    if (p && p.classList && p.classList.contains("eq-math")) {
      p.style.cssText =
        "display:inline!important;height:auto!important;max-height:none!important;" +
        "margin:0!important;padding:0!important;vertical-align:middle!important;";
    }
  }

  function all(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var list = scope.querySelectorAll
      ? scope.querySelectorAll(
          'img.eq-math-img, img.eq-inline, img[src*="question_equations"]'
        )
      : [];
    for (var i = 0; i < list.length; i++) force(list[i]);
  }

  window.eqSizeInlineImages = all;

  function boot() { all(document); }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
  window.addEventListener("load", boot);
  setTimeout(boot, 50);
  setTimeout(boot, 400);

  if (typeof MutationObserver !== "undefined") {
    var t = null;
    new MutationObserver(function () {
      if (t) clearTimeout(t);
      t = setTimeout(boot, 30);
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
